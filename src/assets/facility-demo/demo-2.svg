  <rect x="248" y="330" width="304" height="112" rx="16" fill="#FFFFFF"/>
  <rect x="248" y="330" width="304" height="20" rx="10" fill="#7BB5B0" opacity="0.55"/>
  <g fill="#CFDDDA">
    <rect x="272" y="356" width="9" height="70" rx="4"/>
    <rect x="308" y="356" width="9" height="70" rx="4"/>
    <rect x="344" y="356" width="9" height="70" rx="4"/>
    <rect x="380" y="356" width="9" height="70" rx="4"/>
    <rect x="416" y="356" width="9" height="70" rx="4"/>
    <rect x="452" y="356" width="9" height="70" rx="4"/>
    <rect x="488" y="356" width="9" height="70" rx="4"/>
    <rect x="519" y="356" width="9" height="70" rx="4"/>
  </g>
  <rect x="240" y="424" width="320" height="18" rx="9" fill="#EFE7DF"/>
  <rect x="266" y="442" width="16" height="42" rx="8" fill="#D9C7B6"/>
  <rect x="518" y="442" width="16" height="42" rx="8" fill="#D9C7B6"/>

