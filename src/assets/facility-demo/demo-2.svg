      <stop offset="0" stop-color="#F3F8F7"/>
      <stop offset="1" stop-color="#E7F0EE"/>
    </linearGradient>
    <linearGradient id="d2lamp" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#F7E7C9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F7E7C9" stop-opacity="0"/>
