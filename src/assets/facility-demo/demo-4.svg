<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="デモ画像：ケアルームの施術スペース">
  <defs>
    <linearGradient id="d4wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FA"/>
      <stop offset="1" stop-color="#E8F1F0"/>
    </linearGradient>
    <linearGradient id="d4bed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F6F5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#d4wall)"/>

  <!-- 壁のライン -->
  <rect y="286" width="800" height="6" fill="#FFFFFF" opacity="0.8"/>

  <!-- 窓 -->
  <rect x="86" y="92" width="200" height="160" rx="8" fill="#FFFFFF" opacity="0.9"/>
  <rect x="100" y="106" width="172" height="132" rx="4" fill="#DCEAF0"/>
  <circle cx="232" cy="150" r="28" fill="#FFFFFF" opacity="0.7"/>

  <!-- カーテン -->
  <path d="M470 88 q30 130 0 260 h-56 q26 -130 0 -260 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M528 88 q-30 130 0 260 h56 q-26 -130 0 -260 Z" fill="#FFFFFF" opacity="0.75"/>

  <!-- 床 -->
  <rect y="420" width="800" height="180" fill="#E7E0D8"/>
  <rect y="420" width="800" height="9" fill="#D6CCC1"/>

  <!-- 施術ベッド -->
  <rect x="164" y="332" width="472" height="86" rx="20" fill="url(#d4bed)"/>
  <rect x="164" y="332" width="472" height="22" rx="11" fill="#7BB5B0" opacity="0.4"/>
  <rect x="196" y="300" width="132" height="42" rx="18" fill="#FFFFFF"/>
  <rect x="188" y="418" width="20" height="56" rx="10" fill="#CFC5B9"/>
  <rect x="592" y="418" width="20" height="56" rx="10" fill="#CFC5B9"/>

  <!-- タオル -->
  <path d="M392 356 q76 -18 152 0 v34 q-76 -16 -152 0 Z" fill="#E8A5B0" opacity="0.45"/>

  <!-- サイドワゴン -->
  <rect x="660" y="330" width="96" height="90" rx="12" fill="#FFFFFF" opacity="0.95"/>
  <rect x="676" y="352" width="64" height="10" rx="5" fill="#CFDDDA"/>
  <rect x="676" y="376" width="64" height="10" rx="5" fill="#CFDDDA"/>
  <circle cx="708" cy="308" r="18" fill="#7BB5B0" opacity="0.45"/>

  <!-- ラベル -->
  <g opacity="0.9">
    <rect x="640" y="538" width="128" height="34" rx="17" fill="#2D3142" opacity="0.55"/>
    <text x="704" y="561" font-family="'Noto Sans JP', sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle">デモ画像</text>
