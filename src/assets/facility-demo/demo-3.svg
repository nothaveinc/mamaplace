<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="デモ画像：食事とくつろぎのラウンジ">
  <defs>
    <linearGradient id="d3wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF7F1"/>
      <stop offset="1" stop-color="#F5E7DA"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#d3wall)"/>

  <!-- 壁の装飾 -->
  <circle cx="640" cy="150" r="76" fill="#E8A5B0" opacity="0.22"/>
  <circle cx="700" cy="212" r="44" fill="#7BB5B0" opacity="0.2"/>
  <rect x="96" y="96" width="150" height="112" rx="8" fill="#FFFFFF" opacity="0.85"/>
  <path d="M112 190 l40 -52 l34 40 l28 -28 l24 40 Z" fill="#7BB5B0" opacity="0.45"/>

  <!-- 床 -->
  <rect y="404" width="800" height="196" fill="#EADFD4"/>
  <rect y="404" width="800" height="9" fill="#DCCCBD"/>

  <!-- テーブル -->
  <ellipse cx="400" cy="392" rx="252" ry="52" fill="#FFFFFF"/>
  <ellipse cx="400" cy="384" rx="252" ry="52" fill="#FBF3EC"/>
  <rect x="380" y="430" width="40" height="98" rx="12" fill="#D9C4B0"/>
  <ellipse cx="400" cy="530" rx="98" ry="20" fill="#D9C4B0"/>

  <!-- 食器 -->
  <circle cx="298" cy="374" r="46" fill="#FFFFFF"/>
  <circle cx="298" cy="374" r="30" fill="#F4C7A8" opacity="0.6"/>
  <circle cx="440" cy="368" r="34" fill="#FFFFFF"/>
  <circle cx="440" cy="368" r="21" fill="#7BB5B0" opacity="0.45"/>
  <rect x="516" y="336" width="42" height="46" rx="8" fill="#FFFFFF"/>
  <rect x="524" y="346" width="26" height="26" rx="5" fill="#E8A5B0" opacity="0.5"/>

  <!-- 小花 -->
  <rect x="186" y="330" width="26" height="50" rx="8" fill="#FFFFFF"/>
  <circle cx="188" cy="318" r="13" fill="#E8A5B0" opacity="0.7"/>
  <circle cx="212" cy="310" r="11" fill="#F4C7A8" opacity="0.85"/>
  <circle cx="204" cy="330" r="9" fill="#7BB5B0" opacity="0.6"/>

  <!-- 椅子 -->
  <rect x="120" y="404" width="86" height="18" rx="9" fill="#E0CDBA"/>
  <rect x="594" y="404" width="86" height="18" rx="9" fill="#E0CDBA"/>

  <!-- ラベル -->
  <g opacity="0.9">
    <rect x="640" y="538" width="128" height="34" rx="17" fill="#2D3142" opacity="0.55"/>
    <text x="704" y="561" font-family="'Noto Sans JP', sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle">デモ画像</text>
  </g>
</svg>
